<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>焚き火の時間</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#10191b;color:#f7ead2;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;display:grid;place-items:center}.game{width:min(920px,100%);min-height:100vh;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 78%,#563522 0,#28231f 34%,#131c1e 72%)}header{width:min(720px,100%);display:flex;justify-content:space-between;align-items:center;color:#c7b89e;font-size:13px;letter-spacing:.1em}.logo{font-weight:700;color:#f4dfbd}.score{border:1px solid #655546;border-radius:30px;padding:8px 14px}.intro{text-align:center;margin-top:12px}.intro h1{font-size:clamp(28px,5vw,42px);letter-spacing:.1em;margin:8px 0}.intro p{color:#c4b39a;font-size:14px;margin:0}.scene{position:relative;width:min(580px,100%);height:350px;display:grid;place-items:center;margin-top:auto}.moon{position:absolute;right:14%;top:19%;width:52px;height:52px;border-radius:50%;background:#f4dcae;box-shadow:0 0 42px #f5dcae4d}.stars{position:absolute;inset:0;background-image:radial-gradient(#e7d9bb 1px,transparent 1.5px),radial-gradient(#e7d9bb 1px,transparent 1.5px);background-size:95px 80px,137px 111px;background-position:5px 12px,42px 36px;opacity:.4}.fire{position:relative;width:250px;height:270px;display:grid;place-items:end center;filter:drop-shadow(0 0 30px #f66d1c55)}.glow{position:absolute;bottom:18px;width:260px;height:120px;background:#ed641e42;border-radius:50%;filter:blur(32px);transition:all .4s}.flame{position:absolute;bottom:55px;width:105px;height:170px;transform-origin:50% 100%;animation:flicker .8s infinite alternate ease-in-out;transition:transform .35s}.flame:before,.flame:after{content:"";position:absolute;bottom:0;border-radius:55% 45% 48% 52%/70% 65% 35% 30%;transform:rotate(8deg)}.flame:before{left:8px;width:88px;height:162px;background:linear-gradient(0deg,#f3b744,#f47726 52%,#c53e1f);clip-path:polygon(50% 0,62% 23%,94% 42%,84% 75%,100% 100%,0 100%,17% 71%,8% 50%,35% 36%)}.flame:after{left:30px;width:48px;height:103px;background:linear-gradient(#ffeb9a,#ffd14a 65%,#fa7c24);clip-path:polygon(50% 0,80% 30%,100% 57%,84% 100%,10% 100%,0 67%,30% 40%);animation:flicker .55s infinite alternate-reverse}.logs{position:absolute;bottom:30px;width:215px;height:44px}.log{position:absolute;width:190px;height:30px;border-radius:18px;background:repeating-linear-gradient(0deg,#68412c,#68412c 6px,#815336 7px,#815336 10px);border:2px solid #392b23;box-shadow:inset 0 2px 4px #bd835233}.log.one{left:8px;transform:rotate(13deg)}.log.two{right:8px;transform:rotate(-13deg)}.embers{position:absolute;bottom:45px;left:50%;font-size:14px;color:#ffb444;animation:rise 2s infinite ease-out;opacity:0}.controls{display:flex;flex-direction:column;align-items:center;gap:14px;margin:2px 0 20px}.feed{border:0;border-radius:50px;padding:15px 36px;background:linear-gradient(135deg,#e78336,#c95128);color:#fff6e5;font-weight:800;font-size:16px;letter-spacing:.04em;box-shadow:0 8px 22px #b9502844;cursor:pointer;transition:transform .12s,filter .2s}.feed:hover{filter:brightness(1.1);transform:translateY(-2px)}.feed:active{transform:scale(.97)}.hint{font-size:12px;color:#b3a38d}.meter{width:min(390px,85vw);height:7px;background:#4c443a;border-radius:9px;overflow:hidden}.meter span{display:block;height:100%;width:60%;border-radius:inherit;background:linear-gradient(90deg,#e85c23,#f1c05c);transition:width .4s}.status{font-size:13px;color:#e9c894;min-height:20px}.reset{background:none;border:0;color:#8e887e;text-decoration:underline;cursor:pointer;font-size:12px}.toast{position:absolute;top:25%;font-size:22px;font-weight:700;color:#ffd78b;text-shadow:0 2px 10px #e95620;animation:pop .8s forwards;pointer-events:none}@keyframes flicker{to{transform:scale(1.02,1.06) rotate(-2deg)}}@keyframes burst{0%{transform:scale(1)}30%{transform:scale(1.38)}100%{transform:scale(1)}}.fire.burst .flame{animation:burst .7s ease-out,flicker .8s infinite alternate ease-in-out}.fire.burst .glow{animation:burst .7s ease-out}@keyframes rise{0%{opacity:0;transform:translateY(0) translateX(-5px)}25%{opacity:.9}100%{opacity:0;transform:translateY(-120px) translateX(25px)}}@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-48px) scale(1.1)}}@media(max-width:560px){.game{padding:20px 16px}.scene{height:320px}.moon{right:10%;top:12%}.intro p{max-width:300px;line-height:1.7}.fire{transform:scale(.9)}}
</style></head>
<body><main class="game"><header><div class="logo">✦ 焚き火の時間</div><div class="score">🔥 <span id="score">0</span> pt</div></header><section class="intro"><h1>火を育てよう</h1><p>薪をくべて、焚き火を長くあたためよう。</p></section><section class="scene" aria-label="夜の焚き火"><div class="stars"></div><div class="moon"></div><div class="fire" id="fire"><div class="glow" id="glow"></div><div class="flame" id="flame"></div><div class="logs"><div class="log one"></div><div class="log two"></div></div><div class="embers" id="embers">✦</div></div></section><section class="controls"><div class="status" id="status">火はいい調子。薪をくべてみよう。</div><div class="meter"><span id="heat"></span></div><button class="feed" id="feed">＋ 薪をくべる</button><div class="hint">タップで火力アップ ・ 時間とともに火は弱まります</div><button class="reset" id="reset">最初から遊ぶ</button></section></main>
<script>
let heat=60,score=0,ended=false;const $=id=>document.getElementById(id);function render(){ $('heat').style.width=heat+'%';$('score').textContent=score;$('flame').style.transform=`scale(${.68+heat/75},${.62+heat/72})`; $('glow').style.opacity=.35+heat/100;$('glow').style.transform=`scale(${.75+heat/130})`;if(heat<20)$('status').textContent='火が小さくなってきた…薪をくべよう';else if(heat>85)$('status').textContent='あたたかな大きな火！';else $('status').textContent='火はいい調子。薪をくべてみよう。';if(heat<=0){heat=0;ended=true;$('status').textContent=`火が消えました。今回のスコアは ${score} pt`;$('feed').textContent='火は消えました';$('feed').disabled=true;$('feed').style.opacity=.5}}$('feed').onclick=()=>{if(ended)return;heat=Math.min(100,heat+30);score+=Math.round(heat/5)+5;render();$('fire').classList.remove('burst');void $('fire').offsetWidth;$('fire').classList.add('burst');const toast=document.createElement('div');toast.className='toast';toast.textContent=['🔥 いい火！','✨ あたたかい！','🪵 薪をくべた！'][Math.floor(Math.random()*3)];document.querySelector('.scene').append(toast);setTimeout(()=>toast.remove(),850);$('embers').style.animation='none';void $('embers').offsetWidth;$('embers').style.animation='rise 2s infinite ease-out'};setInterval(()=>{if(!ended){heat=Math.max(0,heat-2);if(heat>0)score+=1;render()}},1000);$('reset').onclick=()=>{heat=60;score=0;ended=false;$('feed').disabled=false;$('feed').style.opacity=1;$('feed').textContent='＋ 薪をくべる';render()};render();
</script></body></html>
